name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.binary }} / ${{ matrix.platform.goos }}_${{ matrix.platform.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary:
          - kagi-search
          - kagi-extract
        platform:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
          CGO_ENABLED: "0"
          BINARY_NAME: ${{ matrix.binary }}
          TAG: ${{ github.ref_name }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          # The wrapper scripts download this exact filename; do not change it.
          BINARY="${BINARY_NAME}_${TAG}_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/Nighthawk42/kagi-skills/internal/cli.Version=${TAG}" \
            -o "dist/${BINARY}" "./cmd/${BINARY_NAME}"
          echo "Built: dist/${BINARY}"

      - name: Verify version injection
        if: matrix.platform.goos == 'linux' && matrix.platform.goarch == 'amd64'
        env:
          BINARY_NAME: ${{ matrix.binary }}
          TAG: ${{ github.ref_name }}
        run: |
          out=$("dist/${BINARY_NAME}_${TAG}_linux_amd64" --version)
          echo "$out"
          if [ "$out" != "${BINARY_NAME} ${TAG}" ]; then
            echo "Version was not injected (expected '${BINARY_NAME} ${TAG}'); check the -X ldflags path."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}_${{ matrix.platform.goos }}_${{ matrix.platform.goarch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * | tee checksums.txt

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Extract the section for this tag from CHANGELOG.md
          # Matches from "## [vX.Y.Z]" until the next "## [" or end of file
          NOTES=$(awk -v tag="$TAG" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" tag "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "WARNING: No changelog entry found for $TAG, falling back to auto-generated notes"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            # Write to file to preserve multiline content
            echo "$NOTES" > release_notes.md
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          body_path: ${{ steps.changelog.outputs.fallback == 'false' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.fallback == 'true' }}
          fail_on_unmatched_files: true
